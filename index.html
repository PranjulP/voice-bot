<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voice Bot — Borrower Practice</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #f9f9f9; }
    h2 { color: #333; }
    #status { margin: 16px 0; font-size: 14px; color: #666; min-height: 20px; }
    #talk-btn {
      padding: 16px 32px; font-size: 18px; cursor: pointer;
      background: #2563eb; color: white; border: none; border-radius: 8px;
    }
    #talk-btn:active { background: #dc2626; }
    #talk-btn:disabled { background: #aaa; cursor: not-allowed; }
    #transcript { margin-top: 32px; }
    .message { margin: 12px 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .advisor { background: #dbeafe; text-align: right; }
    .borrower { background: #dcfce7; }
    .label { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>

  <h2>Practice Call — Priya (Advisor)</h2>
  <p style="color:#666; font-size:14px;">Hold the button while you speak. Release to send.</p>

  <div id="status">Connecting...</div>
  <button id="talk-btn" disabled>🎤 Hold to Talk</button>

  <div id="transcript"></div>

<script>
  const btn = document.getElementById('talk-btn');
  const status = document.getElementById('status');
  const transcript = document.getElementById('transcript');

  let mediaRecorder;
  let audioChunks = [];

  // --- Audio playback queue ---
  // We receive multiple audio chunks (one per sentence).
  // We queue them and play sequentially so they don't overlap.
  let audioQueue = [];
  let isPlaying = false;

  function enqueueAudio(arrayBuffer) {
    audioQueue.push(arrayBuffer);
    if (!isPlaying) playNext();
  }

  function playNext() {
    if (audioQueue.length === 0) {
      isPlaying = false;
      status.textContent = 'Ready';
      btn.disabled = false;
      return;
    }
    isPlaying = true;
    const buffer = audioQueue.shift();
    const blob = new Blob([buffer], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
    audio.onended = () => playNext(); // play next chunk when this one finishes
  }

  // --- WebSocket Setup ---
  // One persistent connection for the whole session
  const ws = new WebSocket(`wss://voice-bot-production-cecc.up.railway.app/ws`);
  ws.binaryType = 'arraybuffer'; // receive audio as ArrayBuffer not Blob

  ws.onopen = () => {
    status.textContent = 'Ready';
    btn.disabled = false;
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected';
    btn.disabled = true;
  };

  // Handle incoming messages from server
  ws.onmessage = (event) => {
    // Binary = audio chunk → add to playback queue
    if (event.data instanceof ArrayBuffer) {
      enqueueAudio(event.data);
      status.textContent = '🔊 Priya is speaking...';
      return;
    }

    // Text = metadata (transcript, status)
    const msg = JSON.parse(event.data);

    if (msg.type === 'advisor_text') {
      addMessage('advisor', msg.text);
      status.textContent = '⏳ Priya is thinking...';
    }

    if (msg.type === 'borrower_text') {
      addMessage('borrower', msg.text);
    }

    if (msg.type === 'done') {
      // Audio chunks may still be playing — playNext handles re-enabling button
      if (!isPlaying && audioQueue.length === 0) {
        status.textContent = 'Ready';
        btn.disabled = false;
      }
    }
  };

  // --- Recording ---
  btn.addEventListener('mousedown', async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    status.textContent = '🔴 Recording...';
  });

  btn.addEventListener('mouseup', () => {
    if (!mediaRecorder) return;
    mediaRecorder.stop();
    btn.disabled = true;
    status.textContent = '⏳ Transcribing...';

    mediaRecorder.onstop = () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      // Send raw audio bytes over WebSocket
      audioBlob.arrayBuffer().then(buffer => ws.send(buffer));
    };
  });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `<div class="label">${role === 'advisor' ? 'You' : 'Priya'}</div>${text}`;
    transcript.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
  }
</script>
</body>
</html>
