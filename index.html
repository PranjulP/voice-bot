<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Bot — Borrower Practice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif; max-width: 600px; margin: 40px auto;
      padding: 0 20px; background: #f9f9f9;
      /* prevent text selection globally during taps */
      -webkit-user-select: none; user-select: none;
    }
    h2 { color: #333; }
    #status {
      margin: 16px 0; font-size: 14px; color: #666; min-height: 20px;
      text-align: center;
    }
    #call-btn {
      display: block; width: 160px; height: 160px; margin: 20px auto;
      border-radius: 50%; border: none; cursor: pointer;
      font-size: 48px; line-height: 1;
      background: #22c55e; color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      touch-action: manipulation; /* prevent double-tap zoom on mobile */
      transition: background 0.2s, transform 0.1s;
    }
    #call-btn:active { transform: scale(0.95); }
    #call-btn.in-call { background: #dc2626; }
    #call-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* VAD indicator */
    #vad-bar {
      width: 200px; height: 6px; background: #e5e7eb;
      border-radius: 3px; margin: 8px auto; display: none;
    }
    #vad-fill {
      height: 100%; background: #22c55e; border-radius: 3px;
      width: 0%; transition: width 0.05s;
    }

    #transcript { margin-top: 32px; }
    .message { margin: 12px 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .advisor { background: #dbeafe; text-align: right; }
    .borrower { background: #dcfce7; }
    .label { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>

  <h2 style="text-align:center">Practice Call — Priya</h2>
  <p style="color:#666; font-size:14px; text-align:center;">Tap to start. Speak naturally. Tap again to end.</p>

  <div id="status">Connecting...</div>
  <button id="call-btn" disabled>📞</button>
  <div id="vad-bar"><div id="vad-fill"></div></div>

  <div id="transcript"></div>

<script>
  const btn = document.getElementById('call-btn');
  const status = document.getElementById('status');
  const vadBar = document.getElementById('vad-bar');
  const vadFill = document.getElementById('vad-fill');
  const transcript = document.getElementById('transcript');

  // --- State ---
  let isCallActive = false;
  let isBotSpeaking = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let micStream = null;

  // VAD (Voice Activity Detection) via Web Audio API
  let audioContext = null;
  let analyser = null;
  let vadInterval = null;
  const SILENCE_THRESHOLD = 0.015; // RMS level below this = silence
  const SILENCE_DURATION = 1500;   // ms of silence before auto-send
  let silenceTimer = null;
  let hasSpeech = false;

  // --- Audio playback queue ---
  let audioQueue = [];
  let isPlaying = false;

  function enqueueAudio(arrayBuffer) {
    audioQueue.push(arrayBuffer);
    if (!isPlaying) playNext();
  }

  function playNext() {
    if (audioQueue.length === 0) {
      isPlaying = false;
      isBotSpeaking = false;
      if (isCallActive) {
        status.textContent = '🎙️ Your turn...';
        startListening(); // resume mic after bot finishes
      }
      return;
    }
    isPlaying = true;
    isBotSpeaking = true;
    stopListening(); // pause mic while bot speaks
    const buffer = audioQueue.shift();
    const blob = new Blob([buffer], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play().catch(e => console.error('Audio play error:', e));
    audio.onended = () => playNext();
  }

  // --- WebSocket ---
  const ws = new WebSocket(`wss://voice-bot-production-cecc.up.railway.app/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    status.textContent = 'Ready';
    btn.disabled = false;
  };

  ws.onclose = () => {
    status.textContent = 'Disconnected';
    btn.disabled = true;
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      enqueueAudio(event.data);
      status.textContent = '🔊 Priya is speaking...';
      return;
    }

    const msg = JSON.parse(event.data);

    if (msg.type === 'advisor_text') {
      addMessage('advisor', msg.text);
      status.textContent = '⏳ Priya is thinking...';
    }
    if (msg.type === 'borrower_text') {
      addMessage('borrower', msg.text);
    }
    if (msg.type === 'done') {
      if (!isPlaying && audioQueue.length === 0) {
        isBotSpeaking = false;
        if (isCallActive) {
          status.textContent = '🎙️ Your turn...';
          startListening();
        }
      }
    }
  };

  // --- Call button (single tap to start/end) ---
  btn.addEventListener('click', async () => {
    if (!isCallActive) {
      await startCall();
    } else {
      endCall();
    }
  });

  async function startCall() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      status.textContent = 'Mic permission denied';
      return;
    }

    isCallActive = true;
    btn.textContent = '📵';
    btn.classList.add('in-call');
    vadBar.style.display = 'block';

    // Set up Web Audio for VAD
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    const source = audioContext.createMediaStreamSource(micStream);
    source.connect(analyser);

    startListening();
    status.textContent = '🎙️ Your turn...';
  }

  function endCall() {
    isCallActive = false;
    stopListening();
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioContext) {
      audioContext.close();
      audioContext = null;
    }
    audioQueue = [];
    isPlaying = false;
    isBotSpeaking = false;
    btn.textContent = '📞';
    btn.classList.remove('in-call');
    vadBar.style.display = 'none';
    status.textContent = 'Call ended. Tap to call again.';
  }

  function startListening() {
    if (!isCallActive || isBotSpeaking) return;
    if (mediaRecorder && mediaRecorder.state === 'recording') return;

    audioChunks = [];
    hasSpeech = false;
    silenceTimer = null;

    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start(100); // collect chunks every 100ms

    // VAD monitoring loop
    const dataArray = new Uint8Array(analyser.fftSize);
    vadInterval = setInterval(() => {
      if (!analyser) return;
      analyser.getByteTimeDomainData(dataArray);

      // Calculate RMS
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const val = (dataArray[i] - 128) / 128;
        sum += val * val;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      // Update visual bar
      vadFill.style.width = Math.min(rms * 600, 100) + '%';
      vadFill.style.background = rms > SILENCE_THRESHOLD ? '#22c55e' : '#e5e7eb';

      if (rms > SILENCE_THRESHOLD) {
        // User is speaking
        hasSpeech = true;
        if (silenceTimer) {
          clearTimeout(silenceTimer);
          silenceTimer = null;
        }
      } else if (hasSpeech && !silenceTimer) {
        // Silence detected after speech — start countdown
        silenceTimer = setTimeout(() => {
          sendCurrentChunk();
        }, SILENCE_DURATION);
      }
    }, 50);
  }

  function stopListening() {
    if (vadInterval) { clearInterval(vadInterval); vadInterval = null; }
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    vadFill.style.width = '0%';
  }

  function sendCurrentChunk() {
    if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
    stopListening();

    mediaRecorder.onstop = () => {
      if (audioChunks.length === 0) {
        if (isCallActive) startListening();
        return;
      }
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      status.textContent = '⏳ Transcribing...';
      audioBlob.arrayBuffer().then(buffer => ws.send(buffer));
    };
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `<div class="label">${role === 'advisor' ? 'You' : 'Priya'}</div>${text}`;
    transcript.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
  }
</script>
</body>
</html>
